<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Theaft Connector - Pairing</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #0f1115;
        color: #e8e8ec;
        margin: 0;
        padding: 32px;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      p.sub {
        color: #9a9aa5;
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 13px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 6px;
        border: 1px solid #343440;
        background: #1a1c23;
        color: #fff;
        margin-bottom: 16px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 6px;
        border: none;
        background: #4c6ef5;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        background: #343440;
        cursor: default;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        min-height: 18px;
      }
      #status.error {
        color: #ff6b6b;
      }
      #status.ok {
        color: #51cf66;
      }
    </style>
  </head>
  <body>
    <h1>Connect this PC to Theaft</h1>
    <p class="sub">Paste the pairing code generated in the web admin (New Connector).</p>
    <input id="code" maxlength="12" placeholder="XXXX-XXXX" autofocus />
    <button id="connect">Connect</button>
    <div id="status"></div>
    <script src="pairing.js"></script>
  </body>
</html>
