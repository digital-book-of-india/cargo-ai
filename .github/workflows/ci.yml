name: CI

on:
  push:
    branches: [main, feature/development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The integration tests derive "cargo_ai_test" from this and drop it afterwards.
      MONGODB_URI: mongodb://localhost:27017/cargo_ai
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Owner unit tests
        run: npm test
      - name: Backend unit tests
        run: npm test -w @dbi/backend
      - name: Backend integration tests (tenancy, events, shipments, reports, operations)
        run: npm run test:int -w @dbi/backend
      - name: Build backend
        run: npm run build -w @dbi/backend
      - name: Build owner panel
        run: npm run build:owner
      - name: Build super admin panel
        run: npm run build:superadmin

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: reports known vulnerabilities in production dependencies without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
