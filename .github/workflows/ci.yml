name: CI

on:
  push:
    branches: [main, feature/development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # MongoDB must be a replica set: the vision ingestion writes an event and its count in one transaction.
      # The integration tests derive "cargo_ai_test" from this (keeping the options) and drop it afterwards.
      MONGODB_URI: mongodb://127.0.0.1:27017/cargo_ai?replicaSet=rs0&directConnection=true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: No secrets in tracked files
        run: node scripts/check-secrets.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start MongoDB as a single-node replica set
        # A service container cannot take start arguments, so MongoDB is started by hand.
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1})" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary"
      - run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Lint (owner panel)
        run: npm run lint -w @dbi/owner
      - name: Unit tests (owner panel, super admin and backend)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: AI worker tests
        run: |
          pip install -r apps/ai-worker/requirements.txt
          npm run test:worker
      - name: Backend integration tests (tenancy, events, shipments, reports, vision chain, operations)
        run: npm run test:int -w @dbi/backend
      - name: Build backend
        run: npm run build -w @dbi/backend
      - name: Build owner panel
        run: npm run build:owner
      - name: Build super admin panel
        run: npm run build:superadmin

  # The Docker files cannot be built on every developer machine, so CI builds them: a broken Dockerfile shows up here
  # and not on the day of the first deployment. Nothing is pushed anywhere.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Backend image
        run: docker build -f infra/docker/backend.Dockerfile -t dbi-backend .
      - name: Owner panel image
        run: docker build -f infra/docker/web.Dockerfile --build-arg APP=owner --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.test/api/v1 -t dbi-owner .
      - name: Super admin panel image
        run: docker build -f infra/docker/web.Dockerfile --build-arg APP=superadmin --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.test/api/v1 -t dbi-superadmin .
      - name: AI worker image
        run: docker build -t dbi-ai-worker apps/ai-worker
      - name: The backend image starts, reaches a database and answers its readiness check
        run: |
          docker network create ci
          docker run -d --network ci --name mongo mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1})" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)" && break; sleep 2; done
          docker run -d --network ci --name api -p 4000:4000 -e NODE_ENV=production -e "MONGODB_URI=mongodb://mongo:27017/ci?replicaSet=rs0" -e JWT_ACCESS_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef -e CAMERA_SECRET_ENCRYPTION_KEY=ci-only-key-0123456789abcdef0123456789abcdef -e AI_SERVICE_TOKEN=ci-only-token-0123456789abcdef0123456789abcdef -e CORS_ORIGINS=https://panel.example.test dbi-backend
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/health/ready && exit 0; sleep 2; done
          docker logs api
          exit 1

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Still informational: one high finding (postcss, pinned by the owner panel) needs a version bump that has to be
    # installed with the panels' dev servers stopped. Remove this line once `npm audit --omit=dev --audit-level=high` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
