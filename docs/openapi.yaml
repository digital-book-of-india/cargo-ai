/api/v1/admin/overview:
    get:
      summary: Super Admin Platform KPIs & Health Overview
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform KPIs, truthful camera rate, and recent audit activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  requestId:
                    type: string
        '401':
          description: Authentication session required
        '403':
          description: Super admin access required

  /api/v1/admin/owners:
    get:
      summary: Search and paginate shop owners with aggregated shop count
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, PENDING_VERIFICATION]
      responses:
        '200':
          description: Paginated shop owners list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/admin/shops:
    get:
      summary: Search and paginate registered shops with owner information
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PENDING_SETUP, SUSPENDED]
      responses:
        '200':
          description: Paginated shops list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/admin/shops/{shopId}/status:
    patch:
      summary: Activate or suspend shop with mandatory audit reason
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - reason
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED]
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Status successfully updated with audit record
        '400':
          description: Invalid parameters or reason under 5 characters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Shop not found
        '409':
          description: Conflict (Already in status or incomplete setup)

  /api/v1/admin/cameras/health:
    get:
      summary: Truthful camera stream health and AI background worker status
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [ONLINE, OFFLINE, ERROR, PENDING_TEST]
      responses:
        '200':
          description: Camera and worker health snapshot
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/admin/audit-logs:
    get:
      summary: Filter and paginate immutable audit logs
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: actorUserId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit logs trail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden