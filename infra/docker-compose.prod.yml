# Single-host production-like stack: MongoDB (single-node replica set), the API, a job scheduler,
# the AI worker and both panels.
#
#   cp apps/backend/.env.production.example infra/backend.env      # then fill in real values
#   printf 'AI_SERVICE_TOKEN=<same value as in backend.env>\nPUBLIC_API_URL=https://api.example.com/api/v1\n' > infra/.env
#   docker compose -f infra/docker-compose.prod.yml build
#   docker compose -f infra/docker-compose.prod.yml run --rm migrate  # once per release
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Put a TLS-terminating reverse proxy in front (and set TRUST_PROXY=1 in backend.env).
# For a hosted MongoDB (Atlas) remove the `mongo` service and point MONGODB_URI at it.
# MongoDB must be a replica set: the vision ingestion writes an event and its count in one transaction.
# These files have not been built in CI yet: check them on the first deploy (docs/runbook.md).
x-mongo-uri: &mongo-uri
  MONGODB_URI: mongodb://mongo:27017/cargo_ai?replicaSet=rs0

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # initiates the single-node replica set the first time, then reports ok
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  migrate:
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    profiles: ["tools"]
    env_file: backend.env
    environment:
      <<: *mongo-uri
    command: ["node", "dist/migrations/cli.js", "up"]
    depends_on:
      mongo: { condition: service_healthy }

  backend:
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    restart: unless-stopped
    env_file: backend.env
    environment:
      <<: *mongo-uri
    ports: ["4000:4000"]
    volumes:
      - evidence:/data/evidence
    depends_on:
      mongo: { condition: service_healthy }

  # Runs the two one-shot jobs: notification delivery and retry every minute, evidence retention once a day.
  scheduler:
    build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
    restart: unless-stopped
    env_file: backend.env
    environment:
      <<: *mongo-uri
    volumes:
      - evidence:/data/evidence
    command:
      - sh
      - -c
      - 'i=0; while true; do node dist/jobs/notifications.js; if [ $$((i % 1440)) -eq 0 ]; then node dist/jobs/retention.js; fi; i=$$((i+1)); sleep 60; done'
    depends_on:
      mongo: { condition: service_healthy }

  # Reads camera streams and reports crossings to the API. Needs the same AI_SERVICE_TOKEN as the API
  # (at least 32 characters); it refuses to start otherwise.
  ai-worker:
    build: { context: ../apps/ai-worker }
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:4000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in infra/.env (same value as backend.env)}
      WORKER_ID: worker-1
    depends_on: [backend]

  owner:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: owner
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [backend]

  superadmin:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: superadmin
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    environment:
      PORT: "3001"
    ports: ["3001:3001"]
    depends_on: [backend]

volumes:
  mongo-data:
  evidence:
