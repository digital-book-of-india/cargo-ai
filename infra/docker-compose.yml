# Local dev services. Redis is optional (BullMQ); skip it for a UI-only demo.
#
# MongoDB runs as a single-node replica set because the vision ingestion uses transactions.
# Connect from the host with:  mongodb://127.0.0.1:27017/cargo_ai?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # initiates the single-node replica set the first time, then reports ok
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  mongo-data:
